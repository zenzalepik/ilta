<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Artikel - ILTA COM</title>
    <meta name="description" content="Detail artikel ILTA COM." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <style>
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .accent-gradient { background-image: linear-gradient(90deg, #2563eb 0%, #7c3aed 100%); }
      .hero-gradient { background-image: linear-gradient(135deg, #0f172a 0%, #1e293b 52%, #312e81 100%); }
      .brand-button { background: #0f172a; color: #fff; }
      .brand-button:hover { background: #1e293b; }
      .article-prose {
        color: #27272a;
        font-size: 18px;
        line-height: 1.85;
      }
      .article-prose p + p { margin-top: 1.5rem; }
      .article-cover {
        background: radial-gradient(circle at 18% 18%, rgba(37, 99, 235, 0.15), transparent 28%), linear-gradient(135deg, #0f172a 0%, #1e293b 44%, #312e81 100%);
      }
      .article-cta-gradient {
        background: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 46%, #ecfdf5 100%);
      }
      .article-cta-frame {
        background: linear-gradient(90deg, #2563eb 0%, #7c3aed 48%, #2563eb 100%);
        padding: 0 15px 15px;
      }
      .reading-rule {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(17, 24, 39, 0.18), transparent);
      }
      @media (min-width: 768px) {
        .article-prose { font-size: 19px; }
      }
    </style>
  </head>
  <body class="bg-white text-gray-900">
    <header class="fixed top-0 z-50 w-full border-b border-gray-200 bg-white/70 backdrop-blur">
      <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8">
        <a href="index.html" class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-slate-900 text-white font-black text-sm">ILTA</div>
          <span>
            <span class="block text-base font-bold leading-tight">ILTA COM</span>
            <span class="block text-xs font-medium text-gray-500">Detail Artikel</span>
          </span>
        </a>
        <div class="hidden items-center gap-7 text-sm font-semibold text-gray-700 lg:flex">
          <a class="hover:text-blue-700" href="index.html#layanan">Layanan</a>
          <a class="hover:text-blue-700" href="index.html#portofolio">Portofolio</a>
          <a class="hover:text-blue-700" href="artikel.html">Artikel</a>
          <a class="hover:text-blue-700" href="index.html#faq">FAQ</a>
        </div>
        <a href="artikel.html" class="hidden rounded-full border border-gray-300 bg-white px-5 py-3 text-sm text-gray-900 hover:border-blue-600 hover:text-blue-700 lg:inline-flex">Daftar Artikel</a>
      </nav>
    </header>

    <main id="articleRoot"></main>

    <footer class="bg-slate-900 text-white">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-5 py-8 sm:flex-row sm:items-center sm:justify-between lg:px-8">
        <div class="flex items-center gap-3">
          <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-white text-slate-900 font-black text-sm">ILTA</div>
          <p class="font-bold">ILTA COM</p>
        </div>
        <p class="text-sm text-gray-400">&copy; 2026 ILTA COM. All rights reserved.</p>
      </div>
    </footer>

    <script src="articles-data.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const article = window.ILTA_ARTICLES.find((item) => item.slug === slug);
      const root = document.getElementById("articleRoot");

      if (!article) {
        document.title = "Artikel Tidak Ditemukan - ILTA COM";
        root.innerHTML = `
          <section class="hero-gradient px-5 pb-20 pt-36 text-white lg:px-8">
            <div class="mx-auto max-w-4xl">
              <p class="text-sm font-bold uppercase text-blue-300">Artikel tidak ditemukan</p>
              <h1 class="mt-4 text-5xl leading-none sm:text-6xl">Artikel Tidak Ditemukan</h1>
              <p class="mt-6 text-gray-300">Artikel yang Anda cari tidak tersedia atau slug-nya berubah.</p>
              <a href="artikel.html" class="mt-8 inline-flex rounded-lg bg-white px-6 py-3 text-gray-950 hover:bg-gray-100">Kembali ke daftar artikel</a>
            </div>
          </section>
        `;
      } else {
        document.title = `${article.title} - ILTA COM`;
        const relatedArticles = window.ILTA_ARTICLES
          .filter((item) => item.slug !== article.slug)
          .slice(0, 3);

        root.innerHTML = `
          <article class="bg-white">
            <section class="hero-gradient px-5 pb-10 pt-32 text-white lg:px-8 lg:pb-16">
              <div class="mx-auto max-w-5xl">
                <a href="artikel.html" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-300 hover:text-white">
                  <i data-lucide="arrow-left" class="h-4 w-4"></i>
                  Kembali ke Artikel
                </a>
                <div class="mt-9 flex flex-wrap items-center gap-3">
                  <span class="rounded-full bg-white/10 px-4 py-2 text-xs font-bold text-blue-200 ring-1 ring-white/10">${article.category}</span>
                  <span class="text-sm font-semibold text-gray-300">${article.readTime}</span>
                  <span class="text-sm font-semibold text-gray-500">ILTA COM Editorial</span>
                </div>
                <h1 class="mt-7 max-w-5xl text-4xl leading-[0.98] sm:text-5xl lg:text-6xl">${article.title}</h1>
                <p class="mt-7 max-w-3xl text-xl leading-8 text-gray-200 sm:text-2xl">${article.excerpt}</p>
              </div>
            </section>

            <section class="px-5 lg:px-8">
              <figure class="mx-auto -mt-6 max-w-6xl overflow-hidden rounded-2xl border border-white/20 bg-black shadow-2xl lg:-mt-10">
                <div class="article-cover p-5 sm:p-8">
                  <img src="${article.thumbnail}" alt="${article.title}" class="aspect-[16/7] w-full rounded-xl object-cover shadow-2xl" />
                </div>
              </figure>
            </section>

            <section class="px-5 py-14 lg:px-8 lg:py-20">
              <div class="mx-auto grid max-w-6xl gap-12 lg:grid-cols-[minmax(0,1fr)_260px]">
                <div>
                  <div class="mx-auto max-w-[760px]">
                    <div class="reading-rule mb-10"></div>
                    <div class="article-prose">
                      <p>${article.intro}</p>
                      ${article.points.map((point) => `<p>${point}</p>`).join("")}
                    </div>

                    <aside class="my-12 border-y border-gray-200 py-8">
                      <p class="text-2xl italic leading-9 text-gray-800">"${article.excerpt}"</p>
                    </aside>

                    <div class="rounded-2xl border border-gray-200 bg-gray-50 p-6 sm:p-8">
                      <h2 class="text-2xl font-bold text-gray-950">Catatan Penutup</h2>
                      <p class="article-prose mt-5 text-lg leading-8 text-gray-700">${article.closing}</p>
                    </div>

                    <div class="mt-10 flex flex-col gap-3 sm:flex-row">
                      <a href="artikel.html" class="inline-flex justify-center rounded-lg border border-gray-300 bg-white px-6 py-3 text-gray-950 hover:border-blue-600 hover:text-blue-700">Lihat artikel lain</a>
                      <a href="https://wa.me/6281234567890?text=Halo%20ILTA%20COM%2C%20saya%20ingin%20konsultasi%20setelah%20membaca%20artikel%20${encodeURIComponent(article.title)}." target="_blank" rel="noopener" class="brand-button inline-flex justify-center rounded-lg px-6 py-3">Konsultasi Gratis</a>
                    </div>
                  </div>
                </div>

                <aside class="hidden lg:block">
                  <div class="sticky top-28 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
                    <p class="text-xs font-bold uppercase tracking-normal text-blue-700">Baca juga</p>
                    <div class="mt-5 grid gap-5">
                      ${relatedArticles.map((item) => `
                        <a href="artikel-detail.html?slug=${item.slug}" class="group block">
                          <img src="${item.thumbnail}" alt="${item.title}" class="aspect-[16/10] w-full rounded-lg border border-gray-200 object-cover" loading="lazy" />
                          <p class="mt-3 text-sm font-semibold leading-6 text-gray-950 group-hover:text-blue-700">${item.title}</p>
                          <p class="mt-1 text-xs font-semibold text-gray-500">${item.readTime}</p>
                        </a>
                      `).join("")}
                    </div>
                  </div>
                </aside>
              </div>
            </section>

            <section class="px-5 pb-16 lg:px-8 lg:pb-24">
              <div class="article-cta-frame mx-auto max-w-6xl overflow-hidden rounded-2xl shadow-2xl">
                <div class="article-cta-gradient overflow-hidden rounded-b-xl text-gray-950">
                  <div class="accent-gradient h-[15px] w-full"></div>
                  <div class="grid gap-8 p-7 sm:p-10 lg:grid-cols-[1fr_auto] lg:items-center lg:p-12">
                    <div>
                      <p class="text-sm font-bold uppercase text-blue-700">Siap transformasi digital bisnis Anda?</p>
                      <h2 class="mt-4 max-w-3xl text-3xl leading-tight sm:text-4xl lg:text-5xl">Butuh software custom yang sesuai proses bisnis Anda?</h2>
                      <p class="mt-5 max-w-2xl text-lg leading-8 text-gray-700">Ceritakan kebutuhan Anda. Kami bantu petakan alurnya, dari prototype hingga go-live — tanpa komitmen di awal.</p>
                    </div>
                    <div class="flex flex-col gap-3 sm:flex-row lg:flex-col">
                      <a href="https://wa.me/6281234567890?text=Halo%20ILTA%20COM%2C%20saya%20ingin%20konsultasi%20setelah%20membaca%20artikel%20${encodeURIComponent(article.title)}." target="_blank" rel="noopener" class="inline-flex justify-center rounded-lg bg-slate-900 px-6 py-4 text-white hover:bg-slate-800">Konsultasi Gratis</a>
                      <a href="index.html#layanan" class="inline-flex justify-center rounded-lg border border-slate-900/15 bg-white/70 px-6 py-4 text-gray-950 hover:border-slate-900">Lihat Layanan</a>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </article>
        `;
      }

      window.addEventListener("load", () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
