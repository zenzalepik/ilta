<!doctype html>
<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Artikel - ILTA COM</title>
    <meta name="description" content="Detail artikel ILTA COM." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <style>
      body { font-family: Montserrat, ui-sans-serif, system-ui, sans-serif; }
      h1, h2, h3, h4, h5, h6 {
        font-family: Anton, Impact, sans-serif;
        font-weight: 500 !important;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      button, a[class*="px-"] { font-weight: 500 !important; }
      .accent-gradient { background-image: linear-gradient(90deg, #ec4899 0%, #9333ea 100%); }
      .hero-gradient { background-image: linear-gradient(135deg, #000000 0%, #111827 52%, #581c87 100%); }
      .brand-button { background: #000; color: #fff; }
      .brand-button:hover { background: #111827; }
      .article-serif { font-family: Lora, Georgia, serif; }
      .article-prose {
        font-family: Lora, Georgia, serif;
        color: #27272a;
        font-size: 19px;
        line-height: 1.9;
      }
      .article-prose p + p { margin-top: 1.65rem; }
      .article-prose p:first-child::first-letter {
        float: left;
        font-family: Anton, Impact, sans-serif;
        font-size: 5rem;
        line-height: 0.86;
        margin: 0.1rem 0.55rem 0 0;
        color: #111111;
      }
      .article-cover {
        background:
          radial-gradient(circle at 18% 18%, rgba(236, 72, 153, 0.20), transparent 28%),
          linear-gradient(135deg, #050505 0%, #111827 44%, #581c87 100%);
      }
      .article-cta-gradient {
        background:
          radial-gradient(circle at 12% 20%, rgba(34, 197, 94, 0.22), transparent 28%),
          radial-gradient(circle at 88% 14%, rgba(56, 189, 248, 0.22), transparent 20%),
          linear-gradient(135deg, #fdf2f8 0%, #f5f3ff 46%, #ccfbf1 100%);
      }
      .article-cta-frame {
        background: linear-gradient(90deg, #ec4899 0%, #9333ea 48%, #22c55e 86%, #38bdf8 100%);
        padding: 0 15px 15px;
      }
      .reading-rule {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(17, 17, 17, 0.18), transparent);
      }
      @media (min-width: 768px) {
        .article-prose { font-size: 20px; }
      }
    </style>
  </head>
  <body class="bg-white text-gray-900">
    <header class="fixed top-0 z-50 w-full border-b border-gray-200 bg-white/70 backdrop-blur">
      <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8">
        <a href="index.html" class="flex items-center gap-3">
          <span class="grid h-10 w-10 place-items-center rounded-lg bg-black text-sm font-black text-white">IC</span>
          <span>
            <span class="block text-base font-black leading-tight">ILTA COM</span>
            <span class="block text-xs font-medium text-gray-500">Detail artikel</span>
          </span>
        </a>
        <div class="hidden items-center gap-7 text-sm font-semibold text-gray-700 lg:flex">
          <a class="hover:text-black" href="index.html#layanan">Layanan</a>
          <a class="hover:text-black" href="index.html#paket">Paket</a>
          <a class="hover:text-black" href="artikel.html">Artikel</a>
          <a class="hover:text-black" href="index.html#faq">FAQ</a>
        </div>
        <a href="artikel.html" class="hidden rounded-full border border-gray-300 bg-white px-5 py-3 text-sm text-gray-900 hover:border-black lg:inline-flex">Daftar artikel</a>
      </nav>
    </header>

    <main id="articleRoot"></main>

    <footer class="bg-black text-white">
      <div class="accent-gradient h-[15px] w-full"></div>
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-5 py-8 sm:flex-row sm:items-center sm:justify-between lg:px-8">
        <p class="font-black">ILTA COM</p>
        <p class="text-sm text-gray-400">&copy; 2026 ILTA COM. All rights reserved.</p>
      </div>
    </footer>

    <script src="articles-data.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");
      const article = window.ILTA_ARTICLES.find((item) => item.slug === slug);
      const root = document.getElementById("articleRoot");

      if (!article) {
        document.title = "Artikel Tidak Ditemukan - ILTA COM";
        root.innerHTML = `
          <section class="hero-gradient px-5 pb-20 pt-36 text-white lg:px-8">
            <div class="mx-auto max-w-4xl">
              <p class="text-sm font-black uppercase text-pink-300">Artikel tidak ditemukan</p>
              <h1 class="mt-4 text-5xl leading-none sm:text-6xl">Artikel Tidak Ditemukan</h1>
              <p class="mt-6 text-gray-300">Artikel yang Anda cari tidak tersedia atau slug-nya berubah.</p>
              <a href="artikel.html" class="mt-8 inline-flex rounded-lg bg-white px-6 py-3 text-gray-950">Kembali ke daftar artikel</a>
            </div>
          </section>
        `;
      } else {
        document.title = `${article.title} - ILTA COM`;
        const relatedArticles = window.ILTA_ARTICLES
          .filter((item) => item.slug !== article.slug)
          .slice(0, 3);

        root.innerHTML = `
          <article class="bg-white">
            <section class="hero-gradient px-5 pb-10 pt-32 text-white lg:px-8 lg:pb-16">
              <div class="mx-auto max-w-5xl">
                <a href="artikel.html" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-300 hover:text-white">
                  <i data-lucide="arrow-left" class="h-4 w-4"></i>
                  Kembali ke Blog/Artikel
                </a>
                <div class="mt-9 flex flex-wrap items-center gap-3">
                  <span class="rounded-full bg-white/10 px-4 py-2 text-xs font-black text-pink-200 ring-1 ring-white/10">${article.category}</span>
                  <span class="text-sm font-semibold text-gray-300">${article.readTime}</span>
                  <span class="text-sm font-semibold text-gray-500">ILTA COM Editorial</span>
                </div>
                <h1 class="mt-7 max-w-5xl text-4xl leading-[0.98] sm:text-6xl lg:text-7xl">${article.title}</h1>
                <p class="article-serif mt-7 max-w-3xl text-xl leading-9 text-gray-200 sm:text-2xl sm:leading-10">${article.excerpt}</p>
              </div>
            </section>

            <section class="px-5 lg:px-8">
              <figure class="mx-auto -mt-6 max-w-6xl overflow-hidden rounded-2xl border border-white/20 bg-black shadow-2xl lg:-mt-10">
                <div class="article-cover p-5 sm:p-8">
                  <img src="${article.thumbnail}" alt="${article.title}" class="aspect-[16/7] w-full rounded-xl object-cover shadow-2xl" />
                </div>
              </figure>
            </section>

            <section class="px-5 py-14 lg:px-8 lg:py-20">
              <div class="mx-auto grid max-w-6xl gap-12 lg:grid-cols-[minmax(0,1fr)_260px]">
                <div>
                  <div class="mx-auto max-w-[760px]">
                    <div class="reading-rule mb-10"></div>
                    <div class="article-prose">
                      <p>${article.intro}</p>
                      ${article.points.map((point) => `<p>${point}</p>`).join("")}
                    </div>

                    <aside class="my-12 border-y border-gray-200 py-8">
                      <p class="article-serif text-2xl italic leading-10 text-gray-800">"${article.excerpt}"</p>
                    </aside>

                    <div class="rounded-2xl border border-gray-200 bg-gray-50 p-6 sm:p-8">
                      <h2 class="text-3xl text-gray-950">Catatan Penutup</h2>
                      <p class="article-serif mt-5 text-xl leading-9 text-gray-700">${article.closing}</p>
                    </div>

                    <div class="mt-10 flex flex-col gap-3 sm:flex-row">
                      <a href="artikel.html" class="inline-flex justify-center rounded-lg border border-gray-300 bg-white px-6 py-3 text-gray-950 hover:border-black">Lihat artikel lain</a>
                      <a href="https://wa.me/6281234567890?text=Halo%20ILTA%20COM%2C%20saya%20ingin%20konsultasi%20setelah%20membaca%20artikel%20${encodeURIComponent(article.title)}." target="_blank" rel="noopener" class="brand-button inline-flex justify-center rounded-lg px-6 py-3">Konsultasi</a>
                    </div>
                  </div>
                </div>

                <aside class="hidden lg:block">
                  <div class="sticky top-28 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
                    <p class="text-xs font-black uppercase tracking-normal text-purple-700">Baca juga</p>
                    <div class="mt-5 grid gap-5">
                      ${relatedArticles.map((item) => `
                        <a href="artikel-detail.html?slug=${item.slug}" class="group block">
                          <img src="${item.thumbnail}" alt="${item.title}" class="aspect-[16/10] w-full rounded-lg border border-gray-200 object-cover" loading="lazy" />
                          <p class="mt-3 text-sm font-semibold leading-6 text-gray-950 group-hover:text-purple-700">${item.title}</p>
                          <p class="mt-1 text-xs font-semibold text-gray-500">${item.readTime}</p>
                        </a>
                      `).join("")}
                    </div>
                  </div>
                </aside>
              </div>
            </section>

            <section class="px-5 pb-16 lg:px-8 lg:pb-24">
              <div class="article-cta-frame mx-auto max-w-6xl overflow-hidden rounded-2xl shadow-2xl">
                <div class="article-cta-gradient overflow-hidden rounded-b-xl text-gray-950">
                  <div class="accent-gradient h-[15px] w-full"></div>
                  <div class="grid gap-8 p-7 sm:p-10 lg:grid-cols-[1fr_auto] lg:items-center lg:p-12">
                    <div>
                      <p class="text-sm font-black uppercase text-purple-700">Siap bikin digital presence lebih serius?</p>
                      <h2 class="mt-4 max-w-3xl text-3xl leading-tight sm:text-4xl lg:text-5xl">Butuh website atau aplikasi mobile yang rapi, jelas, dan siap dipakai bisnis?</h2>
                      <p class="article-serif mt-5 max-w-2xl text-lg leading-8 text-gray-700">Ceritakan kebutuhan Anda. Kami bantu petakan alurnya, pilih pendekatan yang paling masuk akal, lalu ubah ide mentah menjadi website atau aplikasi yang nyaman digunakan.</p>
                    </div>
                    <div class="flex flex-col gap-3 sm:flex-row lg:flex-col">
                      <a href="https://wa.me/6281234567890?text=Halo%20ILTA%20COM%2C%20saya%20ingin%20konsultasi%20pembuatan%20website%20setelah%20membaca%20artikel%20${encodeURIComponent(article.title)}." target="_blank" rel="noopener" class="inline-flex justify-center rounded-lg bg-gray-950 px-6 py-4 text-white hover:bg-gray-800">Konsultasi Website</a>
                      <a href="https://wa.me/6281234567890?text=Halo%20ILTA%20COM%2C%20saya%20butuh%20konsultasi%20pembuatan%20aplikasi%20mobile%20setelah%20membaca%20artikel%20${encodeURIComponent(article.title)}." target="_blank" rel="noopener" class="inline-flex justify-center rounded-lg border border-gray-950/15 bg-white/70 px-6 py-4 text-gray-950 hover:border-gray-950">Butuh Aplikasi Mobile?</a>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </article>
        `;
      }

      window.addEventListener("load", () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>
</html>
